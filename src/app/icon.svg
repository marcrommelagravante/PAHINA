<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Warm Paper White circular ground for crisp contrast on light and dark browser tabs -->
  <circle cx="60" cy="60" r="58" fill="#F4F1EA" />

  <!-- Soft Powder Blue inner halo -->
  <circle cx="60" cy="60" r="45" fill="#DCE7EF" fill-opacity="0.45" />

  <!-- Outer engraved ring -->
  <circle
    cx="60"
    cy="60"
    r="55.5"
    stroke="#41474D"
    stroke-width="3.6"
    opacity="0.95"
  />

  <!-- Inner engraved ring -->
  <circle
    cx="60"
    cy="60"
    r="44.5"
    stroke="#41474D"
    stroke-width="2.1"
    opacity="0.68"
  />

  <!-- Open book whose central spine rises into a single steam curl -->
  <g
    stroke="#41474D"
    stroke-width="4.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M 60 80 C 51.2 75.2 41.2 74.4 33 76.4 L 33 53.6 C 41.2 51.6 51.2 52.4 60 57.6" />
    <path d="M 60 80 C 68.8 75.2 78.8 74.4 87 76.4 L 87 53.6 C 78.8 51.6 68.8 52.4 60 57.6" />
    <path
      d="M 38 81.4 C 45.2 79.8 53 80.4 60 84.4 C 67 80.4 74.8 79.8 82 81.4"
      stroke-width="3.1"
      opacity="0.76"
    />
    <path d="M 60 80 L 60 57.6 C 60 49.8 54.5 47.2 55.5 41.4 C 56.4 35.6 64.5 34.4 63.9 28.1 C 63.5 24.6 60.8 22.4 59 20.8" />
  </g>
</svg>
